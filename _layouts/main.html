<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1a2b'/%3E%3Crect x='6' y='14' width='20' height='4' fill='%23ffffff'/%3E%3Crect x='19' y='9' width='4' height='14' fill='%23d93a2b'/%3E%3C/svg%3E">
<!--
  The front-of-house layout: home, the demo, the census.

  The criteria are NOT served with this layout. They keep `default.html`,
  which has no navigation, no branding and no script, because a frozen,
  citable document should render identically from an archive in ten years.
  Anything decorative belongs out here, where it can change without touching
  a published document.

  Not named site.html: `site` is in the exclude list in _config.yml (the
  site/ notes directory), and Jekyll's exclude matching is by prefix, so
  _layouts/site.html was dropped from the build without an error.

  Still no external stylesheet, font or script in this file. The demo page
  loads a Python runtime, and says so on the page; nothing else does.

  Pages set `fullbleed: true` to manage their own sections (the home page);
  otherwise content is placed in a reading column. `width: wide` widens it.
-->
<style>
  :root {
    --bg: #f5f7fb;
    --paper: #ffffff;
    --ink: #0f1a2b;
    --ink-2: #33415c;
    --muted: #64708a;
    --rule: #dfe4ed;
    --rule-strong: #b9c2d2;
    --link: #1a56db;
    --action: #1a56db;
    --action-ink: #ffffff;
    --accent: #d1342b;
    --accent-soft: #fdecea;
    --amber: #b7791f;
    --amber-soft: #fdf3e1;
    --ok: #1e7f4f;
    --ok-soft: #e4f4ea;
    --panel: #f5f7fb;
    --dark: #0f1a2b;
    --dark-2: #172538;
    --dark-ink: #e9eef7;
    --dark-muted: #9aa8c2;
    --dark-rule: #2b3a52;
    --w: 46rem;
    --wide: 72rem;
    --container: 72rem;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1017;
      --paper: #121924;
      --ink: #e7ecf5;
      --ink-2: #c5cedd;
      --muted: #94a0b8;
      --rule: #263246;
      --rule-strong: #3b4a63;
      --link: #7fa9f5;
      --action: #3b7cf6;
      --accent: #f0685b;
      --accent-soft: #2d1a19;
      --amber: #e0a94a;
      --amber-soft: #2a2213;
      --ok: #5fc48e;
      --ok-soft: #14261c;
      --panel: #0f1520;
      --dark: #070b11;
      --dark-2: #0f1520;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "kern" 1;
    text-rendering: optimizeLegibility;
  }
  a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--accent); }

  .container { max-width: var(--container); margin: 0 auto; padding: 0 1.5rem; }
  .wrap { max-width: var(--w); margin: 0 auto; padding: 0 1.5rem; }
  .wrap.wide { max-width: var(--wide); }

  /* ---- masthead ---------------------------------------------------- */
  .masthead { background: var(--paper); border-bottom: 1px solid var(--rule); }
  .masthead .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem 2rem; flex-wrap: wrap; padding: 1rem 1.5rem;
    max-width: var(--container); margin: 0 auto;
  }
  .mark { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; color: var(--ink); }
  .mark:hover { color: var(--ink); }
  .mark-glyph {
    width: 30px; height: 30px; border-radius: 7px; background: var(--dark); position: relative; flex: none;
  }
  .mark-glyph::before { content: ""; position: absolute; left: 6px; right: 6px; top: 13px; height: 4px; background: #fff; }
  .mark-glyph::after { content: ""; position: absolute; left: 18px; top: 8px; width: 4px; height: 14px; background: #d93a2b; }
  .mark-name { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.015em; }
  nav { display: flex; flex-wrap: wrap; gap: 0 1.6rem; align-items: center; }
  nav a { font-size: 1rem; font-weight: 500; text-decoration: none; color: var(--ink-2);
          padding: 0.3rem 0; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--ink); border-bottom-color: var(--accent); }
  nav a.nav-cta { color: var(--action); font-weight: 600; }

  /* ---- type -------------------------------------------------------- */
  main.column { padding: 3.5rem 0 5rem; }
  h1, h2, h3 { line-height: 1.12; font-weight: 700; letter-spacing: -0.022em; color: var(--ink); }
  h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); margin: 0 0 1.2rem; }
  h2 { font-size: clamp(1.6rem, 3vw, 2.1rem); margin: 3.4rem 0 1rem; }
  h3 { font-size: 1.2rem; margin: 2rem 0 0.6rem; }
  p, ul, ol { margin: 0 0 1.15rem; }
  ul, ol { padding-left: 1.2rem; }
  li { margin-bottom: 0.45rem; }
  strong { font-weight: 650; }
  .lede { font-size: 1.28rem; line-height: 1.5; color: var(--ink-2); }
  .muted { color: var(--muted); }
  .kicker {
    font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 1rem;
  }
  code, pre, kbd { font-family: var(--mono); font-size: 0.88em; }
  code { background: var(--panel); padding: 0.1em 0.35em; border-radius: 4px; }
  p code, li code { overflow-wrap: anywhere; }
  pre { background: var(--panel); padding: 0.9rem 1.1rem; border-radius: 6px;
        overflow-x: auto; border: 1px solid var(--rule); }
  pre code { background: none; padding: 0; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 3rem 0; }
  blockquote { margin: 1.4rem 0; padding: 0.1rem 0 0.1rem 1.1rem;
               border-left: 3px solid var(--rule-strong); color: var(--ink-2); }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; background: var(--paper); }
  th, td { text-align: left; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--rule); }
  th { font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase;
       color: var(--muted); font-weight: 600; background: var(--panel); }
  td code { background: none; padding: 0; }
  .wrap.wide > h1, .wrap.wide > h2, .wrap.wide > h3,
  .wrap.wide > p, .wrap.wide > ul, .wrap.wide > ol,
  .wrap.wide > blockquote { max-width: var(--w); }
  h2[id], h3[id] { scroll-margin-top: 1rem; }
  h2[id]:target, h3[id]:target { background: var(--amber-soft); }

  /* ---- buttons ------------------------------------------------------ */
  .btn {
    display: inline-block; font-size: 1.02rem; font-weight: 600; text-decoration: none;
    color: var(--action-ink); background: var(--action); border: 1px solid var(--action);
    padding: 0.85rem 1.4rem; border-radius: 6px; line-height: 1.2;
  }
  .btn:hover { background: #1447b8; border-color: #1447b8; color: #fff; }
  .btn-2 { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
  .btn-2:hover { background: transparent; color: var(--action); border-color: var(--action); }
  .btn-light { background: #fff; color: var(--dark); border-color: #fff; }
  .btn-light:hover { background: #e9eef7; border-color: #e9eef7; color: var(--dark); }

  /* ---- cards & sections (home) ------------------------------------- */
  .section { padding: 4.5rem 0; }
  .section.tight { padding: 3rem 0; }
  .section.white { background: var(--paper); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .section.dark { background: var(--dark); color: var(--dark-ink); }
  .section.dark h2, .section.dark h3 { color: #fff; }
  .section.dark a { color: #fff; }
  .section.dark a.btn-light { color: var(--dark); }
  .section.dark a.btn-light:hover { color: var(--dark); }
  .section.dark .kicker { color: var(--dark-muted); }
  .section-head { max-width: 46rem; margin-bottom: 2rem; }
  .section-head h2 { margin-top: 0; }
  .section-head p { color: var(--ink-2); font-size: 1.1rem; }
  .grid-3 { display: grid; gap: 1.4rem; }
  @media (min-width: 52rem) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
    padding: 1.6rem 1.7rem 1.7rem; min-width: 0;
  }
  .card h3 { margin: 0 0 0.6rem; }
  .card p { margin: 0 0 0.8rem; color: var(--ink-2); }
  .card p:last-child { margin-bottom: 0; }
  .card .step-n { font-family: var(--mono); font-size: 0.85rem; color: var(--accent); margin-bottom: 0.6rem; display: block; }
  .card.link { display: block; text-decoration: none; color: inherit; }
  .card.link:hover { border-color: var(--action); }
  .card.link h3 { color: var(--ink); }
  .card.link p { color: var(--ink-2); }
  .card.link .more { color: var(--action); font-weight: 600; }

  footer { border-top: 1px solid var(--rule); padding: 2.2rem 0 3.5rem; font-size: 0.95rem; color: var(--muted); background: var(--paper); }
  footer a { color: var(--muted); }
  footer p { margin: 0 0 0.5rem; }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 1rem; top: 1rem; background: var(--paper); padding: 0.5rem; }
  @media print { .masthead, nav, footer, .btn { display: none; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="bar">
    <a class="mark" href="{{ '/' | relative_url }}">
      <span class="mark-glyph" aria-hidden="true"></span>
      <span class="mark-name">Evaluator Integrity</span>
    </a>
    <nav>
      <a href="{{ '/demo/' | relative_url }}">Demo</a>
      <a href="{{ '/#evidence' | relative_url }}">Evidence</a>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a class="nav-cta" href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>

{% if page.fullbleed %}
<main id="main">
{{ content }}
</main>
{% else %}
<main id="main" class="column">
<div class="wrap {{ page.width }}">
{{ content }}
</div>
</main>
{% endif %}

<footer>
  <div class="container">
    <p>Evaluator Integrity · London ·
       <a href="mailto:idilgozel@evaluatorintegrity.com">idilgozel@evaluatorintegrity.com</a> ·
       <a href="https://arxiv.org/abs/2609.00088">arXiv:2609.00088</a> ·
       <a href="https://github.com/idilgozel/evaluator-integrity">GitHub</a></p>
    <p>Criteria and prose CC BY 4.0. Code Apache-2.0.</p>
  </div>
</footer>
</body>
</html>
