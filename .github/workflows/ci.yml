name: ci

# A repository publishing a standard for evaluation integrity does not ship
# failing checks. Green here is a precondition for publishing a criteria
# version, not a nice-to-have.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The history scan below needs all of it. The default shallow
          # checkout would leave it scanning one commit and reporting clean.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest tests/ -q

      # Runs on every push and PR. Note this is the *late* line of defence:
      # by the time CI sees a leak it is already in history, where deleting it
      # does not remove it. The pre-commit hook in .githooks/ is the one that
      # prevents the commit existing. See CONTRIBUTING.md.
      - name: Public-safety check
        run: python scripts/check_public_safe.py

      # Publishing this repository publishes every commit ever made, not the
      # current state. The working-tree scan above cannot see a file that was
      # committed and later deleted; this one can, and it is the only check
      # that still works once a leak is in. It refuses to run on a shallow
      # clone rather than reporting clean over one commit.
      - name: Public-safety check (history)
        run: python scripts/check_public_safe.py --history

      - name: Conformance report
        run: python -m conformance.report --check

      # The artifact tree is not committed here (it is large, and it contains
      # non-publishable strata), so this normally skips. It announces the skip
      # loudly and emits a warning annotation rather than passing quietly --
      # a run that verified nothing must not look like a run that verified
      # everything.
      #
      # Publishing a criteria version additionally requires this to run for
      # real, with --require-artifacts, against a local artifact tree.
      - name: Verify evidence quotes
        run: python -m conformance.verify_quotes --check

      # Runs for real on a bare clone: the ledger it checks is in the
      # repository, not in an artifact tree. It fails on a quantity stated in
      # the criteria with no recorded source, and on a criterion edited away
      # from the evidence recorded for it. It does NOT fail on claims nobody
      # has read back out of the source yet -- those are counted and printed.
      #
      # Publishing a criteria version additionally requires
      # --require-sources, which turns those into failures.
      - name: Verify the citation chain
        run: python -m conformance.verify_citations --check

      # Question, pass condition and published prose are one requirement
      # stated three times. This fails when they stop agreeing -- the defect
      # that stood in C2 for a while, found by reading rather than by any
      # check.
      - name: Check criteria coherence
        run: python -m conformance.coherence --check

      # The census page is generated from the corpus. A page stating a
      # verdict count that someone edited by hand is a number with nothing
      # behind it; this fails the build when the two have drifted.
      - name: Census page matches the corpus
        run: python scripts/build_census.py --check

      - name: Verify the pre-commit hook is wired
        run: |
          test -x .githooks/pre-commit \
            || { echo "::error::.githooks/pre-commit is missing or not executable"; exit 1; }
